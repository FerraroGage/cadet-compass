name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Every fact has a source and a verified-on date
        run: npm run content:validate
      - name: Committed bundle matches content and its signature verifies
        run: npm run content:check
      - run: npm test
      - run: npm run check
      - run: npm run build
