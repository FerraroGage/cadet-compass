<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="application-name" content="Cadet Compass" />
    <meta name="apple-mobile-web-app-title" content="Cadet Compass" />
    <meta name="description" content="Cadet Compass: find your way through JROTC. An unofficial study app for ranks, ribbons, chain of command, uniform, drill and general knowledge. Works offline." />
    <!-- connect-src: this app's own files, plus the account service (Supabase) when accounts are turned on. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.supabase.co; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Cadet Compass</title>
    <style>
      /* Loading screen: shown before the script arrives, faded out by App.svelte. The compass is never rotated (brand rule). */
      #splash { position: fixed; inset: 0; z-index: 10; display: grid; place-content: center; justify-items: center; gap: 28px; background: #fbf8ee; transition: opacity 0.3s, visibility 0s 0.3s; }
      #splash.out { opacity: 0; visibility: hidden; }
      #splash img { width: min(70vw, 280px); height: auto; animation: splash-in 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) backwards; }
      #splash i { width: 120px; height: 6px; border-radius: 3px; background: #f2ebd3; overflow: hidden; }
      #splash i::after { content: ''; display: block; width: 40%; height: 100%; border-radius: 3px; background: #e8b923; animation: sweep 0.9s ease-in-out infinite alternate; }
      @keyframes splash-in { from { opacity: 0; transform: scale(0.92); } }
      @keyframes sweep { from { transform: translateX(0); } to { transform: translateX(150%); } }
      @media (prefers-reduced-motion: reduce) { #splash img, #splash i::after { animation: none; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="splash" role="status" aria-label="Loading Cadet Compass">
      <img src="./icons/logo.svg" alt="" width="1100" height="300" />
      <i></i>
    </div>
    <noscript>Cadet Compass needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
