name: Android APK
# Builds a signed APK. Push a tag like v0.2.0 and the APK is attached to a GitHub Release of that name,
# ready to download on a phone. Run it by hand (Actions tab) to get a test build as a workflow artifact.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # to create the release and attach the APK

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run content:check
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Version from the tag (or "test" for a manual run)
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; else echo "VERSION=test-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"; fi
      - name: Signing key from secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
      - name: Build signed APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PversionName="$VERSION" -PversionCode="$GITHUB_RUN_NUMBER"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/cadet-compass-$VERSION.apk"
      - name: Attach to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/cadet-compass-$VERSION.apk" --title "Cadet Compass $VERSION" --notes "Download the .apk on your Android phone and open it to install."
      - name: Keep a test build
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: cadet-compass-${{ env.VERSION }}
          path: ${{ runner.temp }}/cadet-compass-${{ env.VERSION }}.apk
